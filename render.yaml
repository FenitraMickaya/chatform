# One-click deployment blueprint for Render.
# Create the service, the PostgreSQL instance and the environment variable
# from the Render dashboard, then point DATABASE_URL at the managed database.
services:
  - type: web
    name: formpulse
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20.9.0"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: formpulse-db
          property: connectionString
      - key: DATABASE_SSL
        value: "false"

databases:
  - name: formpulse-db
    plan: free
    databaseName: formpulse
    user: formpulse
